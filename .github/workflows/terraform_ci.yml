name: Terraform CI
on:
  push:
    branches: [main]
  pull_request:
permissions: 
  id-token: write
  contents: read
jobs: 
  terraform:
      runs-on: ubuntu-latest
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_USE_OIDC: true
        ARM_USE_AZUREAD: true
        TF_VAR_key_secret_value: ${{ secrets.KEY_SECRET_VALUE }}
        TF_VAR_key_vault_name: "kv-platform-dev-testlab"
        TF_VAR_my_public_ip: ${{ secrets.MY_PUBLIC_IP }}
        TF_VAR_storage_account_log_name: "stplatformlogsdev"
      steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Azure Login (OIDC)
          uses: azure/login@v2
          with:
            client-id:        ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id:        ${{ secrets.AZURE_TENANT_ID }}
            subscription-id:  ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3

        - name: Terraform Format
          run: terraform fmt -check

        - name: Terraform Init
          run: terraform init -backend-config="use_azuread_auth=true" -backend-config="use_oidc=true" -reconfigure

        - name: Terraform Validate
          run: terraform validate

        - name: Terraform Plan
          run: terraform plan -no-color -lock=false # -no-color disables ANSI codes and makes output more readable
